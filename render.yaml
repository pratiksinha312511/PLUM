# Single-service Render deployment.
#
# The FastAPI backend serves both:
#   * /api/*           - the JSON API
#   * /, /submit/, ... - the statically-exported Next.js frontend (out/)
#
# So one URL hosts the entire PLUM app.
#
# Set SARVAM_API_KEY in the Render dashboard after the first deploy.
services:
  - type: web
    name: plum-claims
    runtime: python
    plan: free
    rootDir: .
    buildCommand: |
      set -e
      cd frontend && npm install && npm run build
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NODE_VERSION
        value: 20.11.0
      - key: SARVAM_API_KEY
        sync: false                       # set manually in dashboard
      - key: SARVAM_BASE_URL
        value: https://api.sarvam.ai/v1
      - key: SARVAM_MODEL
        value: sarvam-m
      - key: SARVAM_VISION_MODEL
        value: sarvam-vision
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_TIMEOUT_SECONDS
        value: "30"
      - key: DATABASE_URL
        value: sqlite:////var/data/claims.db
      - key: FRONTEND_DIST
        value: /opt/render/project/src/frontend/out
    disk:
      name: claims-data
      mountPath: /var/data
      sizeGB: 1
